<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q5: First Nations Road Safety Equity Across Remoteness Areas (2021)</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1050px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>First Nations Road Safety Equity Across Remoteness Areas (2021)</h2>
  <p>💡 <b>Interactive Tip:</b> Hover over the clustered bars to inspect detailed trauma hospitalisations and examine the disparity between First Nations and Non-Indigenous Australians.</p>
  <div id="clusteredChart" style="width:100%; height:580px;"></div>
</div>

<script>
  const zones = ['Major Cities', 'Regional', 'Remote'];

  const firstNationsCounts   = [795, 885, 503];
  const nonIndigenousCounts = [25254, 10332, 600];

  const fnPercents = ['36.4%', '40.5%', '23.0%'];
  const nonIndPercents = ['69.8%', '28.6%', '1.7%'];

  const traceFirstNations = {
    x: zones,
    y: firstNationsCounts,
    name: 'First Nations',
    type: 'bar',
    marker: {
      color: '#e11d48', 
      line: { color: '#be123c', width: 1.5 }
    },
    customdata: fnPercents,
    hovertemplate: '<b>Population: First Nations</b><br>' +
                   'Remoteness: %{x}<br>' +
                   'Hospitalisations: <b>%{y:,}</b><br>' +
                   'Share of Cohort Injuries: %{customdata}' +
                   '<extra></extra>'
  };

  const traceNonIndigenous = {
    x: zones,
    y: nonIndigenousCounts,
    name: 'Non-Indigenous',
    type: 'bar',
    marker: {
      color: '#2563eb', 
      line: { color: '#1d4ed8', width: 1.5 }
    },
    customdata: nonIndPercents,
    hovertemplate: '<b>Population: Non-Indigenous</b><br>' +
                   'Remoteness: %{x}<br>' +
                   'Hospitalisations: <b>%{y:,}</b><br>' +
                   'Share of Cohort Injuries: %{customdata}' +
                   '<extra></extra>'
  };

  const data = [traceFirstNations, traceNonIndigenous];

  const layout = {
    title: {
      text: 'Road Trauma Hospitalisations by Indigenous Status & Remoteness (Australia, 2021)',
      font: { size: 18, color: '#1e293b' }
    },
    xaxis: {
      title: 'Geographical Remoteness Area',
      tickfont: { size: 13, color: '#334155' }
    },
    yaxis: {
      title: 'Number of Hospitalisations',
      gridcolor: '#e2e8f0',
      zerolinecolor: '#cbd5e1'
    },
    barmode: 'group', 
    bargap: 0.25,
    bargroupgap: 0.1,
    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',
    legend: {
      x: 0.82,
      y: 0.98,
      bgcolor: 'rgba(255,255,255,0.85)',
      bordercolor: '#cbd5e1',
      borderwidth: 1
    }
  };

  Plotly.newPlot('clusteredChart', data, layout, { responsive: true });
</script>
</body>
</html>
