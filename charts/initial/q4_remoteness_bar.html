<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q4: Geographic Disparity Across Remoteness Zones (2021)</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Geographical Remoteness Disparity in Hospitalised Road Injuries (2021)</h2>
  <p>💡 <b>Interactive Tip:</b> Hover over the horizontal bars to see exact injury figures and proportions across urban, regional, and remote zones.</p>
  <div id="barChart" style="width:100%; height:450px;"></div>
</div>

<script>
  const remotenessZones = ['Remote', 'Regional', 'Major Cities'];
  const hospitalisations = [1114, 11407, 26355];
  const percentages = ['2.9%', '29.4%', '67.8%'];

  const data = [{
    type: 'bar',
    x: hospitalisations,
    y: remotenessZones,
    orientation: 'h', 
    marker: {
      color: ['#0284c7', '#0369a1', '#075985'], 
      line: { color: '#0c4a6e', width: 1.5 }
    },
    text: hospitalisations.map((val, idx) => `  ${val.toLocaleString()} (${percentages[idx]})`),
    textposition: 'outside',
    insidetextfont: { size: 13, color: '#334155' },
    hovertemplate: '<b>Zone: %{y}</b><br>' +
                   'Hospitalisations: %{x:,}<extra></extra>'
  }];

  const layout = {
    title: {
      text: 'Total Hospitalised Road Crash Injuries Ranked by Remoteness (Australia, 2021)',
      font: { size: 18, color: '#1e293b' }
    },
    xaxis: {
      title: 'Number of Hospitalisations',
      gridcolor: '#e2e8f0',
      range: [0, 31000], 
      zerolinecolor: '#cbd5e1'
    },
    yaxis: {
      title: 'Remoteness Area',
      tickfont: { size: 14, color: '#334155' }
    },
    margin: { l: 120, r: 50, t: 70, b: 60 },
    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff'
  };

  Plotly.newPlot('barChart', data, layout, { responsive: true });
</script>
</body>
</html>
