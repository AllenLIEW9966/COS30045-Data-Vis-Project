<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q3: Vulnerable Road Users vs Vehicle Occupants (2021)</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Vulnerable Road Users vs. Vehicle Occupants (Australia, 2021)</h2>
  <p>💡 <b>Interactive Tip:</b> Hover over the donut segments to view exact counts and overall percentages. Click the legend items to filter categories.</p>
  <div id="donutChart" style="width:100%; height:600px;"></div>
</div>

<script>
  const categories = ['Vulnerable Road Users', 'Vehicle Occupants'];
  const values = [19380, 18539]; 

  const breakdownDetails = [
    'Motorcyclists: 8,883<br>Pedal Cyclists: 8,163<br>Pedestrians: 2,334',
    'Car Drivers: 13,327<br>Car Passengers: 4,495<br>Unspecified Position: 717'
  ];

  const data = [{
    labels: categories,
    values: values,
    type: 'pie',
    hole: 0.55, 
    marker: {
      colors: ['#f59e0b', '#3b82f6'], 
      line: { color: '#ffffff', width: 2 }
    },
    textinfo: 'label+percent',
    textposition: 'inside',
    insidetextfont: { size: 14, color: '#ffffff', family: 'sans-serif' },
    customdata: breakdownDetails,
    hovertemplate: '<b>%{label}</b><br>' +
                   'Hospitalisations: %{value:,} (%{percent})<br>' +
                   '------------------------------<br>' +
                   '<b>Detailed Breakdown:</b><br>%{customdata}' +
                   '<extra></extra>'
  }];

  const layout = {
    title: {
      text: 'Proportion of Serious Road Crash Hospitalisations by Road User Group',
      font: { size: 18, color: '#1e293b' }
    },
    annotations: [
      {
        font: { size: 16, color: '#475569', weight: 'bold' },
        showarrow: false,
        text: 'Total<br><b>37,919</b>',
        x: 0.5,
        y: 0.5
      }
    ],
    showlegend: true,
    legend: {
      orientation: 'h',
      x: 0.25,
      y: -0.05
    },
    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff'
  };

  Plotly.newPlot('donutChart', data, layout, { responsive: true });
</script>
</body>
</html>
