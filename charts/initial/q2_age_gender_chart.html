<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q2: Road Trauma Hospitalisations by Age Cohort & Gender (2021)</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1100px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Age Cohort & Gender Vulnerability in Serious Road Trauma (2021)</h2>
  <p>💡 <b>Interactive Tip:</b> Click the legend to toggle Male or Female data; hover over bars to inspect hospitalisation counts and gender distribution per age group.</p>
  <div id="barChart" style="width:100%; height:600px;"></div>
</div>

<script>
  
  const ageGroups = ['0-7', '8-16', '17-25', '26-39', '40-64', '65-74', '75+'];

  
  const maleCounts   = [416, 2150, 5226, 6186, 8702, 1795, 1313];
  const femaleCounts = [291,  713, 2783, 3237, 4324, 1223, 1145];

  // 男性柱状图配置
  const traceMale = {
    x: ageGroups,
    y: maleCounts,
    name: 'Male',
    type: 'bar',
    marker: {
      color: '#2563eb',
      line: { color: '#1d4ed8', width: 1.5 }
    },
    hovertemplate: '<b>Age Group: %{x}</b><br>Gender: Male<br>Hospitalisations: %{y:,}<extra></extra>'
  };

  const traceFemale = {
    x: ageGroups,
    y: femaleCounts,
    name: 'Female',
    type: 'bar',
    marker: {
      color: '#ec4899',
      line: { color: '#db2777', width: 1.5 }
    },
    hovertemplate: '<b>Age Group: %{x}</b><br>Gender: Female<br>Hospitalisations: %{y:,}<extra></extra>'
  };

  const data = [traceMale, traceFemale];

  const layout = {
    title: {
      text: 'Road Crash Hospitalisations Across Age Groups by Gender (Australia, 2021)',
      font: { size: 18, color: '#1e293b' }
    },
    xaxis: {
      title: 'Age Group (Years)',
      tickfont: { size: 13, color: '#475569' }
    },
    yaxis: {
      title: 'Number of Hospitalisations',
      gridcolor: '#e2e8f0',
      zerolinecolor: '#cbd5e1'
    },
    barmode: 'group',
    bargap: 0.25,
    bargroupgap: 0.1,
    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',
    legend: {
      x: 0.88,
      y: 0.98,
      bgcolor: 'rgba(255,255,255,0.8)',
      bordercolor: '#cbd5e1',
      borderwidth: 1
    }
  };

  Plotly.newPlot('barChart', data, layout, { responsive: true });
</script>
</body>
</html>
