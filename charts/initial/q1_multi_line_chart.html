<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q1: National & State Road Crash Hospitalisation Trends (2012–2021)</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f8fafc; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 1100px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>National & State Road Crash Hospitalisation Trends (2012–2021)</h2>
  <p>💡 <b>Interactive Tip:</b> Click any legend item to toggle state visibility; double-click a state to isolate its trend; hover over data points for detailed figures.</p>
  <div id="lineChart" style="width:100%; height:620px;"></div>
</div>

<script>
  const years = ['2012', '2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021'];

  const seriesData = [
    { name: 'NSW', values: [11121, 11421, 11313, 11084, 11474, 11016, 9794, 9942, 9274, 9003], color: '#2563eb' },
    { name: 'Vic', values: [8098, 7784, 8523, 9198, 10360, 10794, 11453, 11392, 9884, 11130], color: '#059669' },
    { name: 'Qld', values: [6813, 7821, 7725, 8306, 8702, 9134, 9381, 9515, 9801, 10447], color: '#d97706' },
    { name: 'WA', values: [3493, 3475, 3154, 3183, 3031, 3195, 3274, 3534, 3636, 3568], color: '#dc2626' },
    { name: 'SA', values: [2311, 2221, 2381, 2467, 2654, 2394, 2489, 2457, 2503, 2632], color: '#7c3aed' },
    { name: 'Tas', values: [536, 570, 646, 677, 657, 659, 781, 708, 778, 805], color: '#0891b2' },
    { name: 'ACT', values: [601, 573, 542, 700, 654, 632, 712, 665, 629, 740], color: '#db2777' },
    { name: 'NT', values: [496, 561, 575, 691, 709, 703, 832, 656, 787, 710], color: '#ea580c' },
    { name: 'Australia (National)', values: [34024, 35001, 35515, 37082, 38963, 39339, 39590, 39866, 37966, 39505], color: '#0f172a', dash: 'dash', width: 3.5 }
  ];

  const traces = seriesData.map(item => ({
    x: years,
    y: item.values,
    mode: 'lines+markers',
    name: item.name,
    line: {
      color: item.color,
      width: item.width || 2,
      dash: item.dash || 'solid'
    },
    marker: { size: 6 },
    hovertemplate: `<b>${item.name}</b><br>Year: %{x}<br>Hospitalisations: %{y:,}<extra></extra>`
  }));

  const layout = {
    title: {
      text: 'Road Crash Hospitalisations Across Australian States (2012–2021)',
      font: { size: 18, color: '#1e293b' }
    },
    xaxis: {
      title: 'Calendar Year',
      gridcolor: '#e2e8f0',
      dtick: 1
    },
    yaxis: {
      title: 'Number of Hospitalisations',
      gridcolor: '#e2e8f0'
    },
    legend: {
      orientation: 'v',
      x: 1.02,
      y: 1
    },
    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',
    hovermode: 'closest'
  };

  Plotly.newPlot('lineChart', traces, layout, { responsive: true });
</script>
</body>
</html>
